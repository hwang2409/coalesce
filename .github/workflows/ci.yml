name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with: {version: latest}
      - run: uv run --extra test ruff check .

  pytest:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: pytest (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.64.1
      - run: npx playwright@1.64.1 install --with-deps chromium
      - run: echo "PLAYWRIGHT_MODULE=${{ github.workspace }}/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.2
        with: {version: latest}
      - name: assert partition and run shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: 4
          COALESCE_REQUIRE_SKETCH: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as file:
              testpaths = tomllib.load(file)["tool"]["pytest"]["ini_options"]["testpaths"]
          assert testpaths == ["tests"], f"update CI shard discovery for testpaths={testpaths!r}"
          PY
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort)
          test "${#files[@]}" -gt 0

          overrides=(
            tests/test_actionable_enclosure_errors.py
            tests/test_assembly_inspection.py
            tests/test_assembly.py
            tests/test_mcp_edge_roles.py
          )
          for file in "${overrides[@]}"; do
            test -f "$file" || { echo "rebalance override does not exist: $file" >&2; exit 1; }
          done

          assigned_shard() {
            case "$1" in
              tests/test_actionable_enclosure_errors.py) echo 1 ;;
              tests/test_assembly_inspection.py) echo 0 ;;
              tests/test_assembly.py) echo 2 ;;
              tests/test_mcp_edge_roles.py) echo 3 ;;
              *) echo $(($2 % SHARD_COUNT)) ;;
            esac
          }

          declare -a seen=()
          for ((shard = 0; shard < SHARD_COUNT; shard++)); do
            shard_files=()
            for i in "${!files[@]}"; do
              if (("$(assigned_shard "${files[$i]}" "$i")" == shard)); then
                shard_files+=("${files[$i]}")
                seen[i]=$((seen[i] + 1))
              fi
            done
            printf 'shard %d (%d files):\n' "$shard" "${#shard_files[@]}"
            printf '  %s\n' "${shard_files[@]}"
          done

          test "${#seen[@]}" -eq "${#files[@]}"
          for i in "${!files[@]}"; do
            test "${seen[$i]}" -eq 1
          done
          printf 'partition assertion passed: %d files assigned exactly once across %d shards\n' "${#files[@]}" "$SHARD_COUNT"

          selected=()
          for i in "${!files[@]}"; do
            if (("$(assigned_shard "${files[$i]}" "$i")" == SHARD)); then
              selected+=("${files[$i]}")
            fi
          done
          test "${#selected[@]}" -gt 0
          uv run --extra test --extra sketch pytest -q --durations=20 "${selected[@]}"

  windows-stdio-export:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.2
        with: {version: latest}
      - name: run bounded stdio and STEP export portability test
        run: uv run --extra test pytest -q --durations=0 tests/test_windows_stdio_export.py

  goldens:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with: {version: latest}
      - name: run eval goldens through stdio server
        run: |
          out=$(mktemp -d)
          uv run python -m evals.golden.pcb_change "$out/change"
          uv run python -m evals.golden.pcb_edge_treatments "$out/edge"
          uv run python -m evals.golden.pcb_refresh_treatments "$out/refresh"
          uv run python -m evals.golden.screw_closure_pattern_edit "$out/closure-pattern"
          uv run --extra sketch python -m evals.golden.constrained_inner_loop "$out/inner-loop"
          uv run --extra sketch python -m evals.golden.constrained_sketch_update_after_extrusion "$out/sketch-update"
          uv run --extra sketch python -m evals.golden.constrained_sketch_dimension_update_after_extrusion "$out/dimension-update"
          uv run python -m evals.golden.revolve_shaft_edit "$out/revolve-shaft"
