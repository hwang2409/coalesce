name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.64.1
      - run: npx playwright@1.64.1 install --with-deps chromium
      - run: echo "PLAYWRIGHT_MODULE=${{ github.workspace }}/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with: {version: latest}
      - run: uv run --extra test ruff check .
      - run: uv run --extra test --extra sketch pytest -q
        env:
          COALESCE_REQUIRE_SKETCH: "1"
