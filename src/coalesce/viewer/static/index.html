<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coalesce viewer</title>
<link rel="stylesheet" href="/static/viewer.css">
<script type="module" src="/static/viewer.js"></script>
</head>
<body>
<aside class="panel" aria-label="Model">
  <header class="masthead">
    <span class="wordmark">coalesce</span>
    <span class="link" id="link" data-state="connecting">
      <span class="dot" aria-hidden="true"></span><span id="link-text">Connecting</span>
    </span>
  </header>

  <section class="revision" aria-live="polite">
    <p class="revision-line"><span class="revision-name">Revision</span>
      <span class="revision-number" id="revision" data-testid="revision" data-empty>none</span></p>
    <p class="revision-meta" id="revision-meta">No committed geometry yet</p>
  </section>

  <section class="parts" aria-labelledby="parts-title">
    <h2 id="parts-title">Parts <span class="unit">size in mm</span></h2>
    <ul id="parts"></ul>
  </section>
</aside>

<main class="stage">
  <canvas id="view" aria-label="3D view of the current revision"></canvas>

  <div class="banners">
    <div class="stale" id="stale" role="status" hidden>
      <p class="stale-title">Not live</p>
      <p class="stale-body" id="stale-body"></p>
    </div>
    <div class="failure" id="failure" role="alert" hidden>
      <p class="failure-title" id="failure-title"></p>
      <p class="failure-features" id="failure-features"></p>
      <p class="failure-error" id="failure-error"></p>
    </div>
  </div>

  <div class="notice" id="notice">
    <p class="notice-title" id="notice-title">Connecting to coalesce</p>
    <p class="notice-body" id="notice-body"></p>
  </div>

  <div class="gizmo" aria-hidden="true">
    <span class="gizmo-label" id="gx">X</span>
    <span class="gizmo-label" id="gy">Y</span>
    <span class="gizmo-label" id="gz">Z</span>
  </div>

  <div class="scale" id="scale" hidden>
    <span class="scale-bar" id="scale-bar"></span>
    <span class="scale-text" id="scale-text"></span>
  </div>

  <nav class="views" aria-label="Camera">
    <div class="segmented" role="group" aria-label="View direction">
      <button type="button" data-view="iso" aria-pressed="false" disabled>Iso</button>
      <button type="button" data-view="front" aria-pressed="false" disabled>Front</button>
      <button type="button" data-view="right" aria-pressed="false" disabled>Right</button>
      <button type="button" data-view="top" aria-pressed="false" disabled>Top</button>
    </div>
    <button type="button" class="fit" id="fit" disabled>Fit</button>
  </nav>
</main>
</body>
</html>
