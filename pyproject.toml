[project]
name = "coalesce"
version = "0.1.0"
description = "typed feature graphs with semantic CAD references"
requires-python = ">=3.12,<3.14"
dependencies = [
    "build123d>=0.13,<0.14",
    "mcp>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coalesce"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
