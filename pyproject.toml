[project]
name = "coalesce"
version = "0.1.0"
description = "typed feature graphs with semantic CAD references"
requires-python = ">=3.12,<3.14"
dependencies = [
    "build123d>=0.13,<0.14",
    "mcp>=1.12,<2",
]

[project.scripts]
coalesce = "coalesce.__main__:main"

[project.optional-dependencies]
sketch = ["planegcs==0.9.6"]
test = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coalesce"]

[tool.hatch.build.targets.wheel.force-include]
"docs/vision.md" = "coalesce/guides/vision.md"
"docs/errors.md" = "coalesce/guides/errors.md"
"docs/sketch.md" = "coalesce/guides/sketch.md"
"docs/hole.md" = "coalesce/guides/hole.md"
"docs/enclosures.md" = "coalesce/guides/enclosures.md"
"docs/refresh.md" = "coalesce/guides/refresh.md"
"docs/revolve.md" = "coalesce/guides/revolve.md"
"docs/assembly.md" = "coalesce/guides/assembly.md"
"docs/examples/cycloidal-disc.md" = "coalesce/guides/examples/cycloidal-disc.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = ["slow: exhaustive tests that take more than 60 seconds"]

[tool.ruff]
target-version = "py312"
line-length = 100
